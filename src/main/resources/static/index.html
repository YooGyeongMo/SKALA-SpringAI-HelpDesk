<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKALA HelpDesk AI</title>
<style>
  :root { --bg:#f4f6f9; --card:#ffffff; --ink:#1c2333; --sub:#6b7488; --accent:#2f6bff; --line:#e3e8f0; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Apple SD Gothic Neo','Pretendard',sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 22px; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:17px; }
  header .badge { font-size:11px; color:var(--accent); border:1px solid var(--accent); border-radius:20px; padding:2px 9px; }
  header .cfg { margin-left:auto; display:flex; gap:8px; align-items:center; font-size:12px; color:var(--sub); }
  header input { width:90px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; font-size:12px; }
  header a { font-size:12px; color:var(--sub); }
  #chat { flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:14px; max-width:860px; width:100%; margin:0 auto; }
  .msg { max-width:78%; padding:12px 16px; border-radius:14px; font-size:14px; line-height:1.65; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .meta { align-self:flex-start; display:flex; gap:6px; flex-wrap:wrap; margin-top:-8px; }
  .chip { font-size:11px; background:#eef2ff; color:#3b5bcc; border-radius:20px; padding:2px 10px; }
  .chip.tool { background:#e8f8ef; color:#1d7a46; }
  .chip.cache { background:#fff4e0; color:#a5690b; }
  footer { background:var(--card); border-top:1px solid var(--line); padding:14px 22px; }
  form { max-width:860px; margin:0 auto; display:flex; gap:10px; }
  #q { flex:1; padding:12px 16px; border:1px solid var(--line); border-radius:10px; font-size:14px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:0 22px; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.5; }
  .hint { max-width:860px; margin:8px auto 0; font-size:11px; color:var(--sub); display:flex; gap:10px; flex-wrap:wrap; }
  .hint span { cursor:pointer; text-decoration:underline dotted; }
</style>
</head>
<body>
<header>
  <h1>🛎️ SKALA HelpDesk AI</h1><span class="badge">RAG · Tool · Memory · SSE</span>
  <div class="cfg">
    사용자 <input id="uid" value="user1"> 세션 <input id="sid" value="web-1">
    <label><input type="checkbox" id="sync"> 동기(toolUsed/cached 표시)</label>
    <a href="/swagger-ui.html" target="_blank">Swagger</a>
  </div>
</header>
<div id="chat"></div>
<footer>
  <form id="f">
    <input id="q" placeholder="예: 반품 규정이 어떻게 되나요?" autocomplete="off">
    <button id="send">전송</button>
  </form>
  <div class="hint">예시:
    <span>반품 규정이 어떻게 되나요?</span>
    <span>제 주문 12345 지금 어디예요?</span>
    <span>그럼 그거 반품 돼요?</span>
    <span>교환으로 접수해 주세요</span>
  </div>
</footer>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('f');
const q = document.getElementById('q');
const send = document.getElementById('send');
document.querySelectorAll('.hint span').forEach(s => s.onclick = () => { q.value = s.textContent; q.focus(); });

function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function addMeta(sources, toolUsed, cached) {
  const m = document.createElement('div');
  m.className = 'meta';
  (sources || []).forEach(s => { const c = document.createElement('span'); c.className = 'chip'; c.textContent = '📄 ' + s.document; m.appendChild(c); });
  if (toolUsed) { const c = document.createElement('span'); c.className = 'chip tool'; c.textContent = '🔧 도구 호출'; m.appendChild(c); }
  if (cached)   { const c = document.createElement('span'); c.className = 'chip cache'; c.textContent = '⚡ 캐시 적중'; m.appendChild(c); }
  chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
}
const headers = () => ({ 'Content-Type': 'application/json', 'X-User-Id': document.getElementById('uid').value || 'user1' });
const body = question => JSON.stringify({ question, sessionId: document.getElementById('sid').value || 'web-1' });

form.onsubmit = async e => {
  e.preventDefault();
  const question = q.value.trim();
  if (!question) return;
  add('user', question);
  q.value = ''; send.disabled = true;
  try {
    if (document.getElementById('sync').checked) {
      const res = await fetch('/api/chat', { method: 'POST', headers: headers(), body: body(question) });
      const a = await res.json();
      add('bot', a.answer || a.message || '(응답 없음)');
      addMeta(a.sources, a.toolUsed, a.cached);
    } else {
      const res = await fetch('/api/chat/stream', { method: 'POST', headers: headers(), body: body(question) });
      const bot = add('bot', '');
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '', ev = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n'); buf = lines.pop();
        for (const line of lines) {
          if (line.startsWith('event:')) ev = line.slice(6).trim();
          else if (line.startsWith('data:')) {
            const data = line.slice(5);
            if (ev === 'token') { bot.textContent += data; chat.scrollTop = chat.scrollHeight; }
            else if (ev === 'sources') { try { addMeta(JSON.parse(data), false, false); } catch (_) {} }
          }
        }
      }
    }
  } catch (err) { add('bot', '⚠️ 오류: ' + err.message); }
  send.disabled = false; q.focus();
};
</script>
</body>
</html>
