spring:
  application:
    name: springai-final-helpdesk

  datasource:
    url: jdbc:postgresql://localhost:5432/springai
    username: springai
    password: springai

  ai:
    openai:
      # 키는 소스에 넣지 않는다.  .env 의 OPENAI_API_KEY 를 scripts/run.sh 가 로드한다.
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
          max-tokens: 800            # 비용 공격(초장문 유도) 상한 — 상담 답변 5문장에는 충분
      embedding:
        options:
          model: text-embedding-3-small     # 1536 차원 — vectorstore dimensions 와 일치

    vectorstore:
      pgvector:
        initialize-schema: true             # 기동 시 vector_store 테이블·인덱스 자동 생성
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

    # 운영에서는 프롬프트 원문 로깅을 끈다 — 개인정보가 로그에 그대로 쌓인다.
    chat:
      observations:
        log-prompt: false
      client:
        observations:
          log-prompt: false

# 공급자·모델·임계값은 전부 설정으로 뺀다 — 코드에 상수를 남기지 않는다.
helpdesk:
  rag:
    top-k: 5
    # /api/admin/chunks 실측으로 조정한 값 — 관련 질문 상위 0.315~0.44, 무관 질문 0.16~0.245.
    # 교재 기본 0.62 는 이 한국어 코퍼스(text-embedding-3-small)에서 전부 차단되어 하향.
    threshold: 0.28
  memory:
    max-messages: 20
  fallback:
    model: gpt-4o-mini
  budget:
    max-avg-tokens-per-query: 3000   # 질의당 평균 토큰 상한(N2) — stats 가 준수 여부 판정
  cache:
    # SimpleVectorStore 코사인 스케일 실측(동일 0.63 / 반품 유사 0.51 / 교환 0.38 / 무관 0.26)
    # → 0.50: 같은 의도 재질문은 적중, 다른 의도는 차단. 애매하면 캐시를 쓰지 않는다.
    threshold: 0.50

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: springai-final-helpdesk

logging:
  level:
    com.skala.helpdesk: DEBUG
    AI_TOOL_AUDIT: INFO
