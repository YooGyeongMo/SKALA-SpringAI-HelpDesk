name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: 빌드 · 테스트 · 비밀 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: API 키 유출 검사
        run: |
          if grep -rInE "sk-(proj-)?[A-Za-z0-9_-]{20,}" --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle .; then
            echo "::error::API 키로 보이는 문자열이 저장소에 포함되어 있습니다"
            exit 1
          fi
          echo "✅ 비밀 없음"

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정 (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      # 단위 테스트는 모델을 부르지 않게 설계되어 있어 OPENAI_API_KEY 없이 통과해야 한다.
      - name: 빌드 + 테스트
        run: ./gradlew build --console=plain

      - name: 테스트 리포트 업로드 (실패 시 확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          if-no-files-found: ignore
